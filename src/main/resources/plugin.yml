name: PositionPolling
description: $description
prefix: PositionPolling
version: '${version}'

main: io.github.svioletg.positionPolling.PositionPolling
api-version: '26.2'
load: POSTWORLD

website: https://github.com/svioletg/papermc-position-polling

commands:
  "status":
    description: "Reports whether position logging is enabled"
    usage: "/positionpolling status"
  "count":
    description: "Prints how many position log entries have been recorded"
    usage: "/positionpolling count"
  "on":
    description: "Enables position logging"
    usage: "/positionpolling on"
  "off":
    description: "Disables position logging"
    usage: "/positionpolling off"
